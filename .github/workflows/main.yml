name: Promote Artifact to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The Run ID containing the artifact'
        required: true
        default: '31602982754'
      tag_name:
        description: 'Tag name for the release (e.g. v3.6.4)'
        required: true
        default: 'v3.6.4'

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Artifact from Run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Split Large Files
        run: |
          mkdir -p split_files
          zip -s 1500m -r split_files/ApplioV3.6.4.zip ApplioV3.6.4/

      - name: Create Release and Upload Split Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          files: split_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
